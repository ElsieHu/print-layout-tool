<div class="toast success" id="toast">图片已添加</div>
<div class="size-tooltip" id="sizeTooltip"></div>

<script>
'use strict';

const PAPER_SIZES = {
  A4:     { w: 210, h: 297 },
  A3:     { w: 297, h: 420 },
  A5:     { w: 148, h: 210 },
  Letter: { w: 215.9, h: 279.4 },
  B5:     { w: 176, h: 250 },
};

const BASE_SCALE = 3.7795;

const STATE = {
  paperSize: 'A4',
  customW: 210,
  customH: 297,
  orientation: 'portrait',
  flipMode: 'long',
  margin: 3,
  snapThreshold: 5,
  showGrid: true,
  showRuler: true,
  showCropMarksFront: true,
  showCropMarksBack: true,
  zoom: 'fit',
  scale: 1,
  fitScale: 1,
  selectedItems: [],
  items: { front: [], back: [] },
  linkMap: new Map(),
  nextId: 1,
  history: [],
  historyIndex: -1,
  clipboard: [],
  _applyingPanel: false,
  pages: [],
  currentPage: 0,
};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }
function mmToPx(mm) { return mm * STATE.scale; }
function pxToMm(px) { return px / STATE.scale; }

function showToast(msg, type = '') {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function getPaperDimensions() {
  let size;
  if (STATE.paperSize === 'custom') {
    size = { w: STATE.customW || 210, h: STATE.customH || 297 };
  } else {
    size = PAPER_SIZES[STATE.paperSize] || { w: 210, h: 297 };
  }
  if (STATE.orientation === 'landscape') {
    return { w: size.h, h: size.w };
  }
  return { w: size.w, h: size.h };
}

function getMargin() {
  return STATE.margin;
}

// ==================== 撤销/重做 ====================
function cloneItem(it) {
  return { ...it, element: null };
}

function saveHistory() {
  STATE.history = STATE.history.slice(0, STATE.historyIndex + 1);
  const snapshot = {
    front: STATE.items.front.map(cloneItem),
    back: STATE.items.back.map(cloneItem),
    linkMap: Array.from(STATE.linkMap.entries()),
    nextId: STATE.nextId,
    selectedItems: STATE.selectedItems.map(s => ({ ...s })),
  };
  STATE.history.push(snapshot);
  STATE.historyIndex++;
  if (STATE.history.length > 60) {
    STATE.history.shift();
    STATE.historyIndex--;
  }
  if (STATE.pages[STATE.currentPage]) {
    STATE.pages[STATE.currentPage].history = STATE.history;
    STATE.pages[STATE.currentPage].historyIndex = STATE.historyIndex;
    STATE.pages[STATE.currentPage].nextId = STATE.nextId;
  }
  updateUndoRedoButtons();
}

function restoreHistory() {
  const snapshot = STATE.history[STATE.historyIndex];
  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    canvas.querySelectorAll('.image-item, .crop-marks, .guide-line').forEach(el => el.remove());
  }
  STATE.items.front = snapshot.front.map(it => ({ ...it, element: null }));
  STATE.items.back = snapshot.back.map(it => ({ ...it, element: null }));
  STATE.linkMap = new Map(snapshot.linkMap.map(([k, v]) => [k, v]));
  STATE.nextId = snapshot.nextId;
  STATE.selectedItems = snapshot.selectedItems.map(s => ({ ...s }));
  for (const side of ['front', 'back']) {
    for (const item of STATE.items[side]) {
      renderImageItem(item, side);
    }
  }
  updateSelectionStyles();
  updateSelectedPanel();
  updateUndoRedoButtons();
}

function undo() {
  if (STATE.historyIndex <= 0) return;
  STATE.historyIndex--;
  restoreHistory();
  showToast('已撤销', '');
}

function redo() {
  if (STATE.historyIndex >= STATE.history.length - 1) return;
  STATE.historyIndex++;
  restoreHistory();
  showToast('已重做', '');
}

function updateUndoRedoButtons() {
  const undoBtn = $('#undoBtn');
  const redoBtn = $('#redoBtn');
  if (undoBtn) undoBtn.disabled = STATE.historyIndex <= 0;
  if (redoBtn) redoBtn.disabled = STATE.historyIndex >= STATE.history.length - 1;
}

function isItemSelected(side, id) {
  return STATE.selectedItems.some(s => s.side === side && s.id === id);
}

// ==================== 画布管理 ====================
function updateCanvasSize() {
  const paper = getPaperDimensions();
  const workspace = $('#workspace');
  const padding = 16;
  const wsW = workspace.clientWidth;
  const minGap = wsW * 0.05;
  const maxGap = wsW * 0.15;
  const idealGap = wsW * 0.1;

  let scale, gapPx;
  if (STATE.zoom === 'fit') {
    const maxW = (wsW - idealGap - padding * 2) / 2;
    const maxH = workspace.clientHeight - padding * 2 - 30;
    const scaleX = maxW / paper.w;
    const scaleY = maxH / paper.h;
    scale = Math.min(scaleX, scaleY, 4);

    const pageW = paper.w * scale;
    const remaining = wsW - pageW * 2 - padding * 2;
    if (remaining > 0) {
      gapPx = Math.max(minGap, Math.min(maxGap, remaining / 3));
    } else {
      gapPx = minGap;
      const maxW2 = (wsW - minGap - padding * 2) / 2;
      scale = Math.min(maxW2 / paper.w, maxH / paper.h, 4);
    }
    STATE.scale = scale;
    STATE.fitScale = scale;
  } else {
    scale = BASE_SCALE * parseFloat(STATE.zoom);
    STATE.scale = scale;

    const pageW = paper.w * scale;
    const remaining = wsW - pageW * 2 - padding * 2;
    if (remaining > 0) {
      gapPx = Math.max(minGap, Math.min(maxGap, remaining / 3));
    } else {
      gapPx = minGap;
    }
  }

  const totalContent = paper.w * scale * 2 + gapPx + padding * 2;
  const fits = totalContent <= wsW;
  workspace.style.gap = gapPx + 'px';
  workspace.style.justifyContent = fits ? 'center' : 'flex-start';

  const wPx = mmToPx(paper.w);
  const hPx = mmToPx(paper.h);

  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    canvas.style.width = wPx + 'px';
    canvas.style.height = hPx + 'px';
    updateCanvasGrid(canvas);
    renderMargin(canvas, side);
  }
  renderRuler();

  for (const side of ['front', 'back']) {
    for (const item of STATE.items[side]) {
      renderImageItem(item, side);
    }
  }

  if (window._updateZoomUI) window._updateZoomUI();
}

function getGridConfig() {
  const threshold = 3;
  const configs = [
    { major: 20, minor: 1, labelInterval: 20 },
    { major: 20, minor: 2, labelInterval: 20 },
    { major: 20, minor: 4, labelInterval: 20 },
    { major: 20, minor: 10, labelInterval: 20 },
  ];
  for (const config of configs) {
    if (mmToPx(config.minor) >= threshold) {
      return config;
    }
  }
  return configs[configs.length - 1];
}

function updateCanvasGrid(canvas) {
  if (!STATE.showGrid) {
    canvas.style.backgroundImage = 'none';
    return;
  }
  const config = getGridConfig();
  const major = mmToPx(config.major);
  const minor = mmToPx(config.minor);
  canvas.style.backgroundImage = `
    linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.015) 1px, transparent 1px)
  `;
  canvas.style.backgroundSize = `${major}px ${major}px, ${major}px ${major}px, ${minor}px ${minor}px, ${minor}px ${minor}px`;
}

function renderMargin(canvas, side) {
  canvas.querySelectorAll('.margin-line').forEach(el => el.remove());
  if (STATE.margin <= 0) return;
  const paper = getPaperDimensions();
  const m = mmToPx(STATE.margin);
  const wPx = mmToPx(paper.w);
  const hPx = mmToPx(paper.h);
  const box = document.createElement('div');
  box.className = 'margin-line';
  box.style.left = m + 'px';
  box.style.top = m + 'px';
  box.style.width = (wPx - 2 * m) + 'px';
  box.style.height = (hPx - 2 * m) + 'px';
  canvas.appendChild(box);
}

function renderRuler() {
  const rulerHInner = $('#rulerHInner');
  const rulerVInner = $('#rulerVInner');
  if (!rulerHInner || !rulerVInner) return;

  rulerHInner.innerHTML = '';
  rulerVInner.innerHTML = '';

  if (!STATE.showRuler) return;

  const paper = getPaperDimensions();
  const config = getGridConfig();
  const workspace = $('#workspace');
  const rulerHRect = $('#rulerH').getBoundingClientRect();
  const rulerVRect = $('#rulerV').getBoundingClientRect();

  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    const cRect = canvas.getBoundingClientRect();
    const offset = cRect.left - rulerHRect.left + workspace.scrollLeft;

    for (let i = 0; i <= paper.w; i += config.minor) {
      const tick = document.createElement('div');
      const isMajor = i % config.major === 0;
      tick.className = 'ruler-tick ' + (isMajor ? 'major' : 'minor');
      tick.style.left = (offset + mmToPx(i)) + 'px';
      rulerHInner.appendChild(tick);

      if (i % config.labelInterval === 0) {
        const label = document.createElement('div');
        label.className = 'ruler-label';
        label.style.left = (offset + mmToPx(i)) + 'px';
        label.textContent = i;
        rulerHInner.appendChild(label);
      }
    }
  }

  const canvas = $('#canvasFront');
  const cRect = canvas.getBoundingClientRect();
  const offsetV = cRect.top - rulerVRect.top + workspace.scrollTop;

  for (let i = 0; i <= paper.h; i += config.minor) {
    const tick = document.createElement('div');
    const isMajor = i % config.major === 0;
    tick.className = 'ruler-tick-v ' + (isMajor ? 'major' : 'minor');
    tick.style.top = (offsetV + mmToPx(i)) + 'px';
    rulerVInner.appendChild(tick);

    if (i % config.labelInterval === 0) {
      const label = document.createElement('div');
      label.className = 'ruler-label-v';
      label.style.top = (offsetV + mmToPx(i)) + 'px';
      label.textContent = i;
      rulerVInner.appendChild(label);
    }
  }

  rulerHInner.style.transform = `translateX(${-workspace.scrollLeft}px)`;
  rulerVInner.style.transform = `translateY(${-workspace.scrollTop}px)`;

  renderRulerHighlight();
}

// 在标尺上渲染选中图片的高亮条（横向紫色竖条 + 竖向紫色横条）
function renderRulerHighlight() {
  const rulerHInner = $('#rulerHInner');
  const rulerVInner = $('#rulerVInner');
  if (!rulerHInner || !rulerVInner) return;

  rulerHInner.querySelectorAll('.ruler-hl-h').forEach(el => el.remove());
  rulerVInner.querySelectorAll('.ruler-hl-v').forEach(el => el.remove());

  if (!STATE.showRuler || STATE.selectedItems.length === 0) return;

  const workspace = $('#workspace');
  const rulerHRect = $('#rulerH').getBoundingClientRect();
  const rulerVRect = $('#rulerV').getBoundingClientRect();

  for (const sel of STATE.selectedItems) {
    const item = getImageItem(sel.side, sel.id);
    if (!item) continue;
    const canvas = $(`#canvas${sel.side === 'front' ? 'Front' : 'Back'}`);
    if (!canvas) continue;
    const cRect = canvas.getBoundingClientRect();

    const offH = cRect.left - rulerHRect.left + workspace.scrollLeft;
    const offV = cRect.top - rulerVRect.top + workspace.scrollTop;

    const hlH = document.createElement('div');
    hlH.className = 'ruler-hl-h';
    hlH.style.left = (offH + mmToPx(item.x)) + 'px';
    hlH.style.width = Math.max(2, mmToPx(item.w)) + 'px';
    rulerHInner.appendChild(hlH);

    const hlV = document.createElement('div');
    hlV.className = 'ruler-hl-v';
    hlV.style.top = (offV + mmToPx(item.y)) + 'px';
    hlV.style.height = Math.max(2, mmToPx(item.h)) + 'px';
    rulerVInner.appendChild(hlV);
  }
}

// ==================== 图片项管理 ====================
function createImageItem(imageSrc, side, x, y, w, h, naturalW, naturalH) {
  const item = {
    id: STATE.nextId++,
    image: imageSrc,
    x, y, w, h,
    naturalW, naturalH,
    linkedId: null,
    hasBackImage: false,
    bleed: 0,
    rotation: 0,
    element: null,
  };
  STATE.items[side].push(item);
  return item;
}

function getImageItem(side, id) {
  return STATE.items[side].find(i => i.id === id);
}

function removeCropMarks(side, id) {
  const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
  canvas.querySelectorAll(`.crop-marks[data-for="${id}"]`).forEach(m => m.remove());
}

function deleteImageItem(side, id) {
  const idx = STATE.items[side].findIndex(i => i.id === id);
  if (idx === -1) return;
  const item = STATE.items[side][idx];

  if (side === 'front' && item.linkedId) {
    const backIdx = STATE.items.back.findIndex(i => i.id === item.linkedId);
    if (backIdx !== -1) {
      const backItem = STATE.items.back[backIdx];
      if (backItem.element) backItem.element.remove();
      removeCropMarks('back', backItem.id);
      STATE.items.back.splice(backIdx, 1);
    }
    STATE.linkMap.delete(id);
    removeCropMarks(side, id);
    if (item.element) item.element.remove();
    STATE.items[side].splice(idx, 1);
  } else if (side === 'back') {
    let frontLink = null;
    for (const f of STATE.items.front) {
      if (f.linkedId === id) { frontLink = f; break; }
    }
    if (frontLink && item.image) {
      item.image = null;
      item.hasBackImage = false;
      renderImageItem(item, 'back');
    } else {
      if (frontLink) frontLink.linkedId = null;
      removeCropMarks(side, id);
      if (item.element) item.element.remove();
      STATE.items[side].splice(idx, 1);
    }
  } else {
    removeCropMarks(side, id);
    if (item.element) item.element.remove();
    STATE.items[side].splice(idx, 1);
  }

  STATE.selectedItems = STATE.selectedItems.filter(s => !(s.side === side && s.id === id));
  renderAllCropMarks('front');
  renderAllCropMarks('back');
  checkOverlaps();
  checkOutOfBounds();
  renderRulerHighlight();
}

function deleteSelectedItems() {
  const items = [...STATE.selectedItems];
  STATE.selectedItems = [];
  for (const sel of items) {
    if (getImageItem(sel.side, sel.id)) {
      deleteImageItem(sel.side, sel.id);
    }
  }
  updateSelectionStyles();
  updateSelectedPanel();
  saveHistory();
}

// ==================== 渲染图片项 ====================
function renderImageItem(item, side) {
  let el = item.element;
  if (!el) {
    el = document.createElement('div');
    el.className = 'image-item';
    el.dataset.id = item.id;
    el.dataset.side = side;
    $(`#canvas${side === 'front' ? 'Front' : 'Back'}`).appendChild(el);
    item.element = el;
    attachItemEvents(el, item, side);
  }

  el.style.left = mmToPx(item.x) + 'px';
  el.style.top = mmToPx(item.y) + 'px';
  el.style.width = mmToPx(item.w) + 'px';
  el.style.height = mmToPx(item.h) + 'px';

  if (item.image) {
    if (!el.querySelector('img')) {
      el.innerHTML = '<img>';
      addResizeHandles(el);
      addRotationButtons(el, item, side);
    }
    const img = el.querySelector('img');
    img.src = item.image;
    const rotation = item.rotation || 0;
    if (rotation === 90 || rotation === 270) {
      img.style.width = mmToPx(item.h) + 'px';
      img.style.height = mmToPx(item.w) + 'px';
      img.style.position = 'absolute';
      img.style.left = '50%';
      img.style.top = '50%';
      img.style.transform = `translate(-50%, -50%) rotate(${rotation}deg)`;
    } else if (rotation === 180) {
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.position = '';
      img.style.left = '';
      img.style.top = '';
      img.style.transform = 'rotate(180deg)';
    } else {
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.position = '';
      img.style.left = '';
      img.style.top = '';
      img.style.transform = '';
    }
  } else {
    if (!el.querySelector('.placeholder')) {
      el.innerHTML = `
        <div class="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
          <div>点击上传背面图片</div>
        </div>`;
      addResizeHandles(el);
      el.querySelector('.placeholder').addEventListener('click', (e) => {
        e.stopPropagation();
        if (e.ctrlKey || e.metaKey) return;
        uploadToBackContainer(item, side);
      });
    }
  }

  updateSelectionStyles();
  renderAllCropMarks(side);
  checkOverlaps();
  checkOutOfBounds();
  renderRulerHighlight();

  if (STATE.selectedItems.length > 0 && !STATE._applyingPanel) {
    const last = STATE.selectedItems[STATE.selectedItems.length - 1];
    if (last.side === side && last.id === item.id) {
      updateSelectedPanel();
    }
  }
}

function addResizeHandles(el) {
  const positions = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
  for (const pos of positions) {
    const handle = document.createElement('div');
    handle.className = `resize-handle ${pos}`;
    handle.dataset.pos = pos;
    el.appendChild(handle);
  }
}

function showResizeHandles(el, showResize, showRotate, showDuplicate) {
  el.querySelectorAll('.resize-handle').forEach(h => {
    h.style.display = showResize ? 'block' : 'none';
  });
  el.querySelectorAll('.rotate-btn').forEach(b => {
    b.style.display = showRotate ? 'flex' : 'none';
  });
  const dupBtn = el.querySelector('.duplicate-btn');
  if (dupBtn) dupBtn.style.display = showDuplicate ? 'flex' : 'none';
}

function addRotationButtons(el, item, side) {
  const btnLeft = document.createElement('button');
  btnLeft.className = 'rotate-btn rotate-btn-left';
  btnLeft.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
  btnLeft.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    rotateImage(item, side, 'left');
  });

  const btnRight = document.createElement('button');
  btnRight.className = 'rotate-btn rotate-btn-right';
  btnRight.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
  btnRight.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    rotateImage(item, side, 'right');
  });

  const btnDup = document.createElement('button');
  btnDup.className = 'duplicate-btn';
  btnDup.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  btnDup.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();
    duplicateSelectedItems();
  });

  el.appendChild(btnLeft);
  el.appendChild(btnRight);
  el.appendChild(btnDup);
}

function rotateImage(item, side, direction) {
  if (!item.image) return;
  const delta = direction === 'right' ? 90 : -90;
  item.rotation = ((item.rotation || 0) + delta + 360) % 360;

  const cx = item.x + item.w / 2;
  const cy = item.y + item.h / 2;
  const tmp = item.w;
  item.w = item.h;
  item.h = tmp;
  item.x = cx - item.w / 2;
  item.y = cy - item.h / 2;

  renderImageItem(item, side);
  syncLinkedItem(item, side);
  updateSelectedPanel();
  saveHistory();
}

// ==================== 选中状态管理 ====================
function selectItem(side, id, additive = false) {
  if (additive) {
    const idx = STATE.selectedItems.findIndex(s => s.side === side && s.id === id);
    if (idx !== -1) {
      STATE.selectedItems.splice(idx, 1);
    } else {
      STATE.selectedItems.push({ side, id });
    }
  } else {
    STATE.selectedItems = [{ side, id }];
  }
  updateSelectionStyles();
  updateSelectedPanel();
  renderRulerHighlight();
}

function deselectAll() {
  STATE.selectedItems = [];
  updateSelectionStyles();
  updateSelectedPanel();
  renderRulerHighlight();
}

function updateSelectionStyles() {
  for (const s of ['front', 'back']) {
    for (const it of STATE.items[s]) {
      if (!it.element) continue;
      const isSel = isItemSelected(s, it.id);
      it.element.classList.toggle('selected', isSel);
      it.element.classList.remove('linked-selected');
      showResizeHandles(it.element, isSel, isSel && STATE.selectedItems.length === 1, isSel);
    }
  }
  for (const sel of STATE.selectedItems) {
    if (sel.side === 'back') {
      for (const f of STATE.items.front) {
        if (f.linkedId === sel.id && f.element) {
          f.element.classList.add('linked-selected');
        }
      }
    } else if (sel.side === 'front') {
      const frontItem = getImageItem('front', sel.id);
      if (frontItem && frontItem.linkedId) {
        const backItem = getImageItem('back', frontItem.linkedId);
        if (backItem && backItem.element) {
          backItem.element.classList.add('linked-selected');
        }
      }
    }
  }
}

// ==================== 裁切线（四角向外延伸 + 自动避让 + 出血）====================
function getVisibleSegments(lineStart, lineEnd, obstacles) {
  const sorted = [...obstacles].sort((a, b) => a.start - b.start);
  const segments = [];
  let current = lineStart;
  for (const obs of sorted) {
    if (obs.start > current) {
      segments.push({ start: current, end: Math.min(obs.start, lineEnd) });
    }
    current = Math.max(current, obs.end);
  }
  if (current < lineEnd) {
    segments.push({ start: current, end: lineEnd });
  }
  return segments;
}

function renderCropMarks(item, side, el) {
  const oldMarks = el.parentElement.querySelectorAll(`.crop-marks[data-for="${item.id}"]`);
  oldMarks.forEach(m => m.remove());

  const showCrop = side === 'front' ? STATE.showCropMarksFront : STATE.showCropMarksBack;
  if (!showCrop) return;

  const canvas = el.parentElement;
  const paper = getPaperDimensions();
  const gap = 0.5;
  const bleed = item.bleed || 0;

  const left = item.x + bleed;
  const right = item.x + item.w - bleed;
  const top = item.y + bleed;
  const bottom = item.y + item.h - bleed;

  const markLeft = left - gap;
  const markRight = right + gap;
  const markTop = top - gap;
  const markBottom = bottom + gap;

  const marksContainer = document.createElement('div');
  marksContainer.className = 'crop-marks';
  marksContainer.dataset.for = item.id;
  marksContainer.style.left = '0';
  marksContainer.style.top = '0';
  marksContainer.style.width = '100%';
  marksContainer.style.height = '100%';

  const obstacles = STATE.items[side]
    .filter(it => it.id !== item.id)
    .map(it => ({
      left: it.x - gap - 0.01,
      top: it.y - gap - 0.01,
      right: it.x + it.w + gap + 0.01,
      bottom: it.y + it.h + gap + 0.01,
    }));

  function drawHLine(y, xStart, xEnd) {
    if (y < 0 || y > paper.h) return;
    const hObs = obstacles
      .filter(o => y >= o.top - 0.01 && y <= o.bottom + 0.01)
      .map(o => ({ start: Math.max(xStart, o.left), end: Math.min(xEnd, o.right) }));
    const segs = getVisibleSegments(xStart, xEnd, hObs);
    for (const seg of segs) {
      if (seg.end - seg.start < 0.5) continue;
      const line = document.createElement('div');
      line.className = 'crop-mark-line';
      line.style.left = mmToPx(seg.start) + 'px';
      line.style.top = mmToPx(y) + 'px';
      line.style.width = mmToPx(seg.end - seg.start) + 'px';
      line.style.height = '0';
      line.style.borderTop = '1px dashed var(--crop-color)';
      marksContainer.appendChild(line);
    }
  }

  function drawVLine(x, yStart, yEnd) {
    if (x < 0 || x > paper.w) return;
    const vObs = obstacles
      .filter(o => x >= o.left - 0.01 && x <= o.right + 0.01)
      .map(o => ({ start: Math.max(yStart, o.top), end: Math.min(yEnd, o.bottom) }));
    const segs = getVisibleSegments(yStart, yEnd, vObs);
    for (const seg of segs) {
      if (seg.end - seg.start < 0.5) continue;
      const line = document.createElement('div');
      line.className = 'crop-mark-line';
      line.style.left = mmToPx(x) + 'px';
      line.style.top = mmToPx(seg.start) + 'px';
      line.style.width = '0';
      line.style.height = mmToPx(seg.end - seg.start) + 'px';
      line.style.borderLeft = '1px dashed var(--crop-color)';
      marksContainer.appendChild(line);
    }
  }

  drawHLine(markTop, 0, markLeft);
  drawVLine(markLeft, 0, markTop);

  drawHLine(markTop, markRight, paper.w);
  drawVLine(markRight, 0, markTop);

  drawHLine(markBottom, 0, markLeft);
  drawVLine(markLeft, markBottom, paper.h);

  drawHLine(markBottom, markRight, paper.w);
  drawVLine(markRight, markBottom, paper.h);

  canvas.appendChild(marksContainer);
}

function renderAllCropMarks(side) {
  for (const it of STATE.items[side]) {
    if (it.element) {
      renderCropMarks(it, side, it.element);
    }
  }
}

// ==================== 重叠检测 ====================
function checkOverlaps() {
  for (const side of ['front', 'back']) {
    const items = STATE.items[side].filter(it => it.image && it.element);
    for (const item of items) {
      const w = item.element.querySelector('.overlap-warning');
      if (w) w.remove();
    }
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        if (rectsOverlap(items[i], items[j])) {
          addOverlapWarning(items[i]);
          addOverlapWarning(items[j]);
        }
      }
    }
  }
}

function rectsOverlap(a, b) {
  return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
}

function addOverlapWarning(item) {
  if (!item.element) return;
  if (item.element.querySelector('.overlap-warning')) return;
  const warning = document.createElement('div');
  warning.className = 'overlap-warning';
  warning.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px;vertical-align:-1px;margin-right:3px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>图片重叠';
  item.element.appendChild(warning);
}

// ==================== 超出画布检测 ====================
function checkOutOfBounds() {
  const paper = getPaperDimensions();
  const tol = 0.5;
  for (const side of ['front', 'back']) {
    for (const item of STATE.items[side]) {
      if (!item.element) continue;
      const w = item.element.querySelector('.out-of-bounds-warning');
      if (w) w.remove();
      if (item.x < -tol || item.y < -tol || item.x + item.w > paper.w + tol || item.y + item.h > paper.h + tol) {
        if (!item.element.querySelector('.out-of-bounds-warning')) {
          const warning = document.createElement('div');
          warning.className = 'out-of-bounds-warning';
          warning.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px;vertical-align:-1px;margin-right:3px;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>已超出画布';
          item.element.appendChild(warning);
        }
      }
    }
  }
}

// ==================== 框选 ====================
function startMarquee(e, side) {
  e.preventDefault();
  const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
  const rect = canvas.getBoundingClientRect();
  const startX = e.clientX - rect.left;
  const startY = e.clientY - rect.top;

  const marquee = document.createElement('div');
  marquee.className = 'marquee-rect';
  marquee.style.left = startX + 'px';
  marquee.style.top = startY + 'px';
  marquee.style.width = '0px';
  marquee.style.height = '0px';
  canvas.appendChild(marquee);

  if (!e.shiftKey) {
    STATE.selectedItems = STATE.selectedItems.filter(s => s.side !== side);
  }

  let moved = false;

  const onMove = (ev) => {
    moved = true;
    const curX = ev.clientX - rect.left;
    const curY = ev.clientY - rect.top;
    const left = Math.min(startX, curX);
    const top = Math.min(startY, curY);
    const width = Math.abs(curX - startX);
    const height = Math.abs(curY - startY);

    marquee.style.left = left + 'px';
    marquee.style.top = top + 'px';
    marquee.style.width = width + 'px';
    marquee.style.height = height + 'px';

    if (!e.shiftKey) {
      STATE.selectedItems = STATE.selectedItems.filter(s => s.side !== side);
    }

    const mx = pxToMm(left);
    const my = pxToMm(top);
    const mw = pxToMm(width);
    const mh = pxToMm(height);

    for (const item of STATE.items[side]) {
      const intersects = !(item.x + item.w < mx || mx + mw < item.x || item.y + item.h < my || my + mh < item.y);
      if (intersects && !isItemSelected(side, item.id)) {
        STATE.selectedItems.push({ side, id: item.id });
      }
    }

    updateSelectionStyles();
    updateSelectedPanel();
    renderRulerHighlight();
  };

  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    marquee.remove();
    if (!moved) {
      deselectAll();
    }
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// ==================== 拖拽和缩放 ====================
function attachItemEvents(el, item, side) {
  el.addEventListener('mousedown', (e) => {
    if (e.target.classList.contains('resize-handle')) {
      if (isItemSelected(side, item.id)) {
        startResize(e, item, side);
      }
      return;
    }
    const additive = e.ctrlKey || e.metaKey;
    if (additive) {
      selectItem(side, item.id, true);
      return;
    }
    if (!isItemSelected(side, item.id)) {
      selectItem(side, item.id, false);
    }
    if (!e.target.classList.contains('placeholder')) {
      startDrag(e, item, side);
    }
  });
}

function startDrag(e, item, side) {
  e.preventDefault();
  const startX = e.clientX;
  const startY = e.clientY;

  let dragGroup = STATE.selectedItems
    .filter(s => s.side === side)
    .map(s => {
      const it = getImageItem(side, s.id);
      return it ? { item: it, origX: it.x, origY: it.y } : null;
    })
    .filter(Boolean);

  if (dragGroup.length === 0 || !dragGroup.find(d => d.item.id === item.id)) {
    dragGroup = [{ item, origX: item.x, origY: item.y }];
  }

  const isMulti = dragGroup.length > 1;

  let groupBox = null;
  if (isMulti) {
    const gMinX = Math.min(...dragGroup.map(d => d.origX));
    const gMaxX = Math.max(...dragGroup.map(d => d.origX + d.item.w));
    const gMinY = Math.min(...dragGroup.map(d => d.origY));
    const gMaxY = Math.max(...dragGroup.map(d => d.origY + d.item.h));
    groupBox = { minX: gMinX, maxX: gMaxX, minY: gMinY, maxY: gMaxY, w: gMaxX - gMinX, h: gMaxY - gMinY };
  }

  const onMove = (ev) => {
    const dx = pxToMm(ev.clientX - startX);
    const dy = pxToMm(ev.clientY - startY);

    let bestSnapDx = null;
    let bestSnapDy = null;
    let allGuides = [];

    if (isMulti) {
      // Snap based on group bounding box edges and center
      const gx = groupBox.minX + dx;
      const gy = groupBox.minY + dy;
      const virtualItem = { id: -1 };
      const snap = checkSnap(virtualItem, side, gx, gy, groupBox.w, groupBox.h);

      if (snap.x !== null) {
        bestSnapDx = snap.x - gx;
      }
      if (snap.y !== null) {
        bestSnapDy = snap.y - gy;
      }
      allGuides = snap.guides;
    } else {
      // Single item: check snap individually
      const entry = dragGroup[0];
      const nx = entry.origX + dx;
      const ny = entry.origY + dy;

      const snap = checkSnap(entry.item, side, nx, ny, entry.item.w, entry.item.h);

      if (snap.x !== null) {
        bestSnapDx = snap.x - nx;
      }
      if (snap.y !== null) {
        bestSnapDy = snap.y - ny;
      }
      allGuides = snap.guides;
    }

    const adjustedDx = dx + (bestSnapDx || 0);
    const adjustedDy = dy + (bestSnapDy || 0);

    for (const entry of dragGroup) {
      entry.item.x = entry.origX + adjustedDx;
      entry.item.y = entry.origY + adjustedDy;
      renderImageItem(entry.item, side);
      syncLinkedItem(entry.item, side);
    }

    showGuides(allGuides, side);
  };

  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    clearGuides(side);
    saveHistory();
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, item, side) {
  e.preventDefault();
  e.stopPropagation();
  const pos = e.target.dataset.pos;
  const startX = e.clientX;
  const startY = e.clientY;
  const orig = { x: item.x, y: item.y, w: item.w, h: item.h };
  const lockRatio = $('#lockRatio').checked;
  const ratio = orig.w / orig.h;
  const tooltip = $('#sizeTooltip');

  const otherItems = STATE.selectedItems
    .filter(s => s.side === side && s.id !== item.id)
    .map(s => {
      const it = getImageItem(s.side, s.id);
      return it ? { item: it, side: s.side, origW: it.w, origH: it.h, origX: it.x, origY: it.y } : null;
    })
    .filter(Boolean);
  const isMultiResize = otherItems.length > 0;

  const onMove = (ev) => {
    const dx = pxToMm(ev.clientX - startX);
    const dy = pxToMm(ev.clientY - startY);
    let { x, y, w, h } = orig;
    const paper = getPaperDimensions();
    const m = getMargin();
    const minSize = 5;

    if (pos.includes('e')) {
      w = Math.max(minSize, orig.w + dx);
      w = Math.min(w, paper.w - m - orig.x);
    }
    if (pos.includes('w')) {
      w = Math.max(minSize, orig.w - dx);
      x = orig.x + (orig.w - w);
      if (x < m) { w = w + x - m; x = m; }
    }
    if (pos.includes('s')) {
      h = Math.max(minSize, orig.h + dy);
      h = Math.min(h, paper.h - m - orig.y);
    }
    if (pos.includes('n')) {
      h = Math.max(minSize, orig.h - dy);
      y = orig.y + (orig.h - h);
      if (y < m) { h = h + y - m; y = m; }
    }

    if (lockRatio && (pos === 'nw' || pos === 'ne' || pos === 'sw' || pos === 'se')) {
      if (Math.abs(dx) > Math.abs(dy)) {
        h = w / ratio;
        if (pos.includes('n')) y = orig.y + (orig.h - h);
      } else {
        w = h * ratio;
        if (pos.includes('w')) x = orig.x + (orig.w - w);
      }
    }

    const snapW = checkSizeSnap(w, side, item.id, 'w');
    if (snapW !== null) {
      w = snapW;
      if (lockRatio) {
        h = w / ratio;
        if (pos.includes('n')) y = orig.y + (orig.h - h);
      }
    }
    const snapH = checkSizeSnap(h, side, item.id, 'h');
    if (snapH !== null) {
      h = snapH;
      if (lockRatio) {
        w = h * ratio;
        if (pos.includes('w')) x = orig.x + (orig.w - w);
      }
    }

    item.x = x;
    item.y = y;
    item.w = w;
    item.h = h;
    renderImageItem(item, side);
    syncLinkedItem(item, side);

    if (isMultiResize) {
      const wRatio = w / orig.w;
      const hRatio = h / orig.h;
      for (const other of otherItems) {
        let newW = other.origW * wRatio;
        let newH = other.origH * hRatio;
        if (lockRatio) {
          const itRatio = other.origW / other.origH;
          if (Math.abs(wRatio - 1) > 0.001) {
            newH = newW / itRatio;
          } else {
            newW = newH * itRatio;
          }
        }
        newW = Math.max(5, Math.min(newW, paper.w - m - other.origX));
        newH = Math.max(5, Math.min(newH, paper.h - m - other.origY));
        other.item.w = newW;
        other.item.h = newH;
        renderImageItem(other.item, other.side);
        syncLinkedItem(other.item, other.side);
      }
    }

    tooltip.textContent = `${w.toFixed(1)} × ${h.toFixed(1)} mm`;
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX + 15) + 'px';
    tooltip.style.top = (ev.clientY + 15) + 'px';
  };

  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    tooltip.style.display = 'none';
    updateSelectedPanel();
    saveHistory();
  };

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function checkSizeSnap(size, side, itemId, dim) {
  const thresholdMm = STATE.snapThreshold;
  let bestDiff = thresholdMm;
  let result = null;
  for (const it of STATE.items[side]) {
    if (it.id === itemId) continue;
    const target = dim === 'w' ? it.w : it.h;
    const diff = Math.abs(size - target);
    if (diff < bestDiff) {
      bestDiff = diff;
      result = target;
    }
  }
  return result;
}

// ==================== 对齐和磁吸 ====================
function checkSnap(item, side, x, y, w, h) {
  const thresholdMm = STATE.snapThreshold;
  let resultX = null;
  let resultY = null;
  const guides = [];
  const paper = getPaperDimensions();
  const m = getMargin();

  const xCandidates = [
    { val: x, type: 'left' },
    { val: x + w / 2, type: 'center-x' },
    { val: x + w, type: 'right' },
  ];
  const yCandidates = [
    { val: y, type: 'top' },
    { val: y + h / 2, type: 'center-y' },
    { val: y + h, type: 'bottom' },
  ];

  const canvasTargetsX = [m, m + (paper.w - 2 * m) / 2, paper.w - m];
  const canvasTargetsY = [m, m + (paper.h - 2 * m) / 2, paper.h - m];

  const otherItemsX = [];
  const otherItemsY = [];
  for (const it of STATE.items[side]) {
    if (it.id === item.id) continue;
    if (isItemSelected(side, it.id)) continue;
    otherItemsX.push(it.x, it.x + it.w / 2, it.x + it.w);
    otherItemsY.push(it.y, it.y + it.h / 2, it.y + it.h);
  }

  const allTargetsX = [...canvasTargetsX, ...otherItemsX];
  const allTargetsY = [...canvasTargetsY, ...otherItemsY];

  let bestXDiff = thresholdMm;
  let bestYDiff = thresholdMm;
  let bestXTarget = null;
  let bestYTarget = null;

  for (const c of xCandidates) {
    for (const target of allTargetsX) {
      const diff = Math.abs(c.val - target);
      if (diff < bestXDiff) {
        bestXDiff = diff;
        bestXTarget = target;
        if (c.type === 'left') resultX = target;
        else if (c.type === 'center-x') resultX = target - w / 2;
        else if (c.type === 'right') resultX = target - w;
      }
    }
  }

  for (const c of yCandidates) {
    for (const target of allTargetsY) {
      const diff = Math.abs(c.val - target);
      if (diff < bestYDiff) {
        bestYDiff = diff;
        bestYTarget = target;
        if (c.type === 'top') resultY = target;
        else if (c.type === 'center-y') resultY = target - h / 2;
        else if (c.type === 'bottom') resultY = target - h;
      }
    }
  }

  if (resultX !== null && bestXTarget !== null) {
    guides.push({ type: 'vertical', pos: bestXTarget });
  }
  if (resultY !== null && bestYTarget !== null) {
    guides.push({ type: 'horizontal', pos: bestYTarget });
  }

  return { x: resultX, y: resultY, guides };
}

function showGuides(guides, side) {
  clearGuides(side);
  const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
  for (const g of guides) {
    const line = document.createElement('div');
    line.className = `guide-line ${g.type === 'horizontal' ? 'horizontal' : 'vertical'}`;
    if (g.type === 'horizontal') {
      line.style.top = mmToPx(g.pos) + 'px';
    } else {
      line.style.left = mmToPx(g.pos) + 'px';
    }
    canvas.appendChild(line);
  }
}

function clearGuides(side) {
  const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
  canvas.querySelectorAll('.guide-line').forEach(l => l.remove());
}

// ==================== 正反面联动 ====================
function syncLinkedItem(item, side) {
  if (side === 'front') {
    let backItem = item.linkedId ? getImageItem('back', item.linkedId) : null;
    if (!backItem) {
      const backPos = computeBackPosition(item);
      backItem = createImageItem(null, 'back', backPos.x, backPos.y, item.w, item.h, 0, 0);
      item.linkedId = backItem.id;
      STATE.linkMap.set(item.id, backItem.id);
    } else {
      const backPos = computeBackPosition(item);
      backItem.x = backPos.x;
      backItem.y = backPos.y;
      backItem.w = item.w;
      backItem.h = item.h;
    }
    renderImageItem(backItem, 'back');
  } else if (side === 'back') {
    let frontItem = null;
    for (const f of STATE.items.front) {
      if (f.linkedId === item.id) { frontItem = f; break; }
    }
    if (frontItem) {
      const frontPos = computeBackPosition(item);
      frontItem.x = frontPos.x;
      frontItem.y = frontPos.y;
      frontItem.w = item.w;
      frontItem.h = item.h;
      renderImageItem(frontItem, 'front');
    }
  }
}

function computeBackPosition(frontItem) {
  const paper = getPaperDimensions();
  const longEdgeIsVertical = STATE.orientation !== 'landscape';
  const doHorizontalMirror = (STATE.flipMode === 'long') === longEdgeIsVertical;
  if (doHorizontalMirror) {
    return { x: paper.w - frontItem.x - frontItem.w, y: frontItem.y };
  } else {
    return { x: frontItem.x, y: paper.h - frontItem.y - frontItem.h };
  }
}

function updateFlipIndicator() {
  const indicator = document.getElementById('flipIndicator');
  if (!indicator) return;
  const label = flipMode === 'long' ? '长边翻页' : '短边翻页';
  indicator.textContent = label;
}

function recomputeAllBackPositions() {
  for (const frontItem of STATE.items.front) {
    if (frontItem.linkedId) {
      const backItem = getImageItem('back', frontItem.linkedId);
      if (backItem) {
        const pos = computeBackPosition(frontItem);
        backItem.x = pos.x;
        backItem.y = pos.y;
        backItem.w = frontItem.w;
        backItem.h = frontItem.h;
        renderImageItem(backItem, 'back');
      }
    }
  }
}

// ==================== 上传图片 ====================
function getImageDPI(buffer) {
  const view = new DataView(buffer);
  if (buffer.byteLength < 4) return null;
  // JPEG: 0xFF 0xD8
  if (view.getUint8(0) === 0xFF && view.getUint8(1) === 0xD8) {
    return getJPEGDPI(view, buffer);
  }
  // PNG: 137 80 78 71 13 10 26 10
  if (view.getUint8(0) === 137 && view.getUint8(1) === 80 && view.getUint8(2) === 78 && view.getUint8(3) === 71) {
    return getPNGDPI(view, buffer);
  }
  return null;
}

function getJPEGDPI(view, buffer) {
  let offset = 2;
  while (offset + 3 < buffer.byteLength) {
    if (view.getUint8(offset) !== 0xFF) { offset++; continue; }
    const marker = view.getUint8(offset + 1);
    offset += 2;
    if ((marker >= 0xD0 && marker <= 0xD9) || marker === 0x01) continue;
    if (marker === 0xDA) break;
    const length = view.getUint16(offset);
    if (marker === 0xE1 && offset + 8 < buffer.byteLength &&
        view.getUint8(offset + 2) === 0x45 && view.getUint8(offset + 3) === 0x78 &&
        view.getUint8(offset + 4) === 0x69 && view.getUint8(offset + 5) === 0x66 &&
        view.getUint8(offset + 6) === 0x00 && view.getUint8(offset + 7) === 0x00) {
      const tiffStart = offset + 8;
      const byteOrder = view.getUint16(tiffStart);
      const le = byteOrder === 0x4949;
      if (view.getUint16(tiffStart + 2, le) !== 0x002A) return null;
      const ifdOffset = view.getUint32(tiffStart + 4, le);
      const entriesStart = tiffStart + ifdOffset;
      const numEntries = view.getUint16(entriesStart, le);
      let xRes = null, yRes = null, unit = 2;
      for (let i = 0; i < numEntries; i++) {
        const e = entriesStart + 2 + i * 12;
        const tag = view.getUint16(e, le);
        if (tag === 0x011A) {
          const vo = view.getUint32(e + 8, le);
          xRes = view.getUint32(tiffStart + vo, le) / view.getUint32(tiffStart + vo + 4, le);
        } else if (tag === 0x011B) {
          const vo = view.getUint32(e + 8, le);
          yRes = view.getUint32(tiffStart + vo, le) / view.getUint32(tiffStart + vo + 4, le);
        } else if (tag === 0x0128) {
          unit = view.getUint16(e + 8, le);
        }
      }
      if (xRes && yRes) {
        if (unit === 3) return { x: xRes * 2.54, y: yRes * 2.54 };
        return { x: xRes, y: yRes };
      }
    }
    offset += length;
  }
  return null;
}

function getPNGDPI(view, buffer) {
  let offset = 8;
  while (offset + 17 < buffer.byteLength) {
    const length = view.getUint32(offset);
    const type = String.fromCharCode(view.getUint8(offset + 4), view.getUint8(offset + 5), view.getUint8(offset + 6), view.getUint8(offset + 7));
    if (type === 'pHYs') {
      const xPPU = view.getUint32(offset + 8);
      const yPPU = view.getUint32(offset + 12);
      const unit = view.getUint8(offset + 16);
      if (unit === 1) return { x: xPPU * 0.0254, y: yPPU * 0.0254 };
      return null;
    }
    offset += 12 + length;
  }
  return null;
}

function handleFileUpload(files, side) {
  const fileArr = [...files].filter(f => f.type.startsWith('image/'));
  let loadIndex = 0;
  for (const file of fileArr) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const paper = getPaperDimensions();
        const m = getMargin();
        let dpi = { x: 300, y: 300 };
        try {
          const buffer = await file.arrayBuffer();
          const parsed = getImageDPI(buffer);
          if (parsed) dpi = parsed;
        } catch(err) {}
        let w = img.naturalWidth / dpi.x * 25.4;
        let h = img.naturalHeight / dpi.y * 25.4;
        const ratio = w / h;
        const maxW = paper.w - 2 * m;
        const maxH = paper.h - 2 * m;
        if (w > maxW || h > maxH) {
          if (ratio > maxW / maxH) {
            w = maxW;
            h = w / ratio;
          } else {
            h = maxH;
            w = h * ratio;
          }
        }
        const offset = loadIndex * 15;
        loadIndex++;
        const x = m + (paper.w - 2 * m - w) / 2 + offset;
        const y = m + (paper.h - 2 * m - h) / 2 + offset;

        const item = createImageItem(e.target.result, side, x, y, w, h, img.naturalWidth, img.naturalHeight);
        renderImageItem(item, side);
        if (side === 'front') {
          syncLinkedItem(item, 'front');
        }
        selectItem(side, item.id);
        showToast('图片已添加', 'success');
        saveHistory();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function uploadToBackContainer(backItem, side) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        backItem.image = ev.target.result;
        backItem.naturalW = img.naturalWidth;
        backItem.naturalH = img.naturalHeight;
        backItem.hasBackImage = true;
        renderImageItem(backItem, 'back');
        showToast('背面图片已添加', 'success');
        saveHistory();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function replaceImage() {
  if (STATE.selectedItems.length === 0) return;
  const sel = STATE.selectedItems[STATE.selectedItems.length - 1];
  const item = getImageItem(sel.side, sel.id);
  if (!item) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        item.image = ev.target.result;
        item.naturalW = img.naturalWidth;
        item.naturalH = img.naturalHeight;
        if (sel.side === 'back') item.hasBackImage = true;
        renderImageItem(item, sel.side);
        showToast('图片已替换', 'success');
        saveHistory();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ==================== 控制面板 ====================
function updateSelectedPanel() {
  const panel = $('#selectedPanel');
  const title = $('#selectedPanelTitle');
  const hasSelection = STATE.selectedItems.length > 0;
  const sel = hasSelection ? STATE.selectedItems[STATE.selectedItems.length - 1] : null;
  const item = sel ? getImageItem(sel.side, sel.id) : null;

  if (STATE.selectedItems.length > 1) {
    title.textContent = `图片编辑 (${STATE.selectedItems.length})`;
  } else {
    title.textContent = '图片编辑';
  }

  // Always show panels, disable when no selection
  panel.classList.toggle('disabled', !hasSelection);

  const alignPanel = $('#alignPanel');
  const alignCount = $('#alignCount');
  const canAlign = STATE.selectedItems.length >= 2;
  alignPanel.classList.toggle('disabled', !canAlign);
  alignCount.textContent = canAlign ? `(${STATE.selectedItems.length}个)` : '';

  const pageAlignPanel = $('#pageAlignPanel');
  if (pageAlignPanel) {
    pageAlignPanel.classList.toggle('disabled', !hasSelection);
  }

  const uniformSizeRow = $('#uniformSizeRow');
  if (uniformSizeRow) {
    uniformSizeRow.classList.toggle('disabled', STATE.selectedItems.length < 2);
  }

  if (item) {
    $('#itemX').value = item.x.toFixed(1);
    $('#itemY').value = item.y.toFixed(1);
    $('#itemW').value = item.w.toFixed(1);
    $('#itemH').value = item.h.toFixed(1);
    $('#itemBleed').value = item.bleed || 0;
  }

  const replaceBtn = $('#replaceItem');
  if (replaceBtn) {
    replaceBtn.style.display = 'block';
  }
}

function applyPanelValues() {
  if (STATE.selectedItems.length === 0) return;
  const sel = STATE.selectedItems[STATE.selectedItems.length - 1];
  const item = getImageItem(sel.side, sel.id);
  if (!item) return;
  const paper = getPaperDimensions();
  const m = getMargin();
  const lockRatio = $('#lockRatio').checked;
  const uniformSize = $('#uniformSize') && $('#uniformSize').checked;

  let newX = parseFloat($('#itemX').value) || 0;
  let newY = parseFloat($('#itemY').value) || 0;
  let newW = Math.max(5, parseFloat($('#itemW').value) || 5);
  let newH = Math.max(5, parseFloat($('#itemH').value) || 5);

  const oldW = item.w;
  const oldH = item.h;
  const oldRatio = oldW / oldH;

  if (lockRatio) {
    if (Math.abs(newW - oldW) > 0.01) newH = newW / oldRatio;
    else if (Math.abs(newH - oldH) > 0.01) newW = newH * oldRatio;
  }

  STATE._applyingPanel = true;

  if (STATE.selectedItems.length > 1) {
    const dx = newX - item.x;
    const dy = newY - item.y;

    if (uniformSize) {
      for (const s of STATE.selectedItems) {
        const it = getImageItem(s.side, s.id);
        if (!it) continue;
        let itNewW = newW;
        let itNewH = newH;
        let itNewX = it.x + dx;
        let itNewY = it.y + dy;
        itNewX = Math.max(m, Math.min(paper.w - m - itNewW, itNewX));
        itNewY = Math.max(m, Math.min(paper.h - m - itNewH, itNewY));
        itNewW = Math.min(itNewW, paper.w - m - itNewX);
        itNewH = Math.min(itNewH, paper.h - m - itNewY);
        it.x = itNewX;
        it.y = itNewY;
        it.w = itNewW;
        it.h = itNewH;
        renderImageItem(it, s.side);
        syncLinkedItem(it, s.side);
      }
    } else {
      const wRatio = newW / oldW;
      const hRatio = newH / oldH;

      for (const s of STATE.selectedItems) {
        const it = getImageItem(s.side, s.id);
        if (!it) continue;
        const itOldRatio = it.w / it.h;

        let itNewW = it.w * wRatio;
        let itNewH = it.h * hRatio;
        if (lockRatio) {
          if (Math.abs(newW - oldW) > 0.01) itNewH = itNewW / itOldRatio;
          else itNewH = it.h * hRatio;
          if (Math.abs(newH - oldH) > 0.01) itNewW = it.h * hRatio * itOldRatio;
          else itNewW = it.w * wRatio;
        }
        itNewW = Math.max(5, itNewW);
        itNewH = Math.max(5, itNewH);

        let itNewX = it.x + dx;
        let itNewY = it.y + dy;

        itNewX = Math.max(m, Math.min(paper.w - m - itNewW, itNewX));
        itNewY = Math.max(m, Math.min(paper.h - m - itNewH, itNewY));
        itNewW = Math.min(itNewW, paper.w - m - itNewX);
        itNewH = Math.min(itNewH, paper.h - m - itNewY);

        it.x = itNewX;
        it.y = itNewY;
        it.w = itNewW;
        it.h = itNewH;
        renderImageItem(it, s.side);
        syncLinkedItem(it, s.side);
      }
    }
  } else {
    newX = Math.max(m, Math.min(paper.w - m - newW, newX));
    newY = Math.max(m, Math.min(paper.h - m - newH, newY));
    newW = Math.min(newW, paper.w - m - newX);
    newH = Math.min(newH, paper.h - m - newY);

    item.x = newX;
    item.y = newY;
    item.w = newW;
    item.h = newH;
    renderImageItem(item, sel.side);
    syncLinkedItem(item, sel.side);
  }

  STATE._applyingPanel = false;
  updateSelectedPanel();
  saveHistory();
}

// ==================== 对齐分布 ====================
function getSelectedItemsBySide() {
  const bySide = { front: [], back: [] };
  for (const sel of STATE.selectedItems) {
    const item = getImageItem(sel.side, sel.id);
    if (item) bySide[sel.side].push(item);
  }
  return bySide;
}

function alignItems(type) {
  if (STATE.selectedItems.length < 2) return;
  const bySide = getSelectedItemsBySide();
  const paper = getPaperDimensions();
  const m = getMargin();
  let didSomething = false;

  for (const side of ['front', 'back']) {
    const items = bySide[side];
    if (items.length < 2) continue;
    didSomething = true;

    switch (type) {
      case 'left': {
        const minLeft = Math.min(...items.map(it => it.x));
        for (const it of items) {
          it.x = Math.max(m, minLeft);
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'right': {
        const maxRight = Math.max(...items.map(it => it.x + it.w));
        for (const it of items) {
          it.x = Math.min(paper.w - m - it.w, maxRight - it.w);
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'centerH': {
        const minLeft = Math.min(...items.map(it => it.x));
        const maxRight = Math.max(...items.map(it => it.x + it.w));
        const center = (minLeft + maxRight) / 2;
        for (const it of items) {
          it.x = Math.max(m, Math.min(paper.w - m - it.w, center - it.w / 2));
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'top': {
        const minTop = Math.min(...items.map(it => it.y));
        for (const it of items) {
          it.y = Math.max(m, minTop);
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'bottom': {
        const maxBottom = Math.max(...items.map(it => it.y + it.h));
        for (const it of items) {
          it.y = Math.min(paper.h - m - it.h, maxBottom - it.h);
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'centerV': {
        const minTop = Math.min(...items.map(it => it.y));
        const maxBottom = Math.max(...items.map(it => it.y + it.h));
        const center = (minTop + maxBottom) / 2;
        for (const it of items) {
          it.y = Math.max(m, Math.min(paper.h - m - it.h, center - it.h / 2));
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'distributeH': {
        if (items.length < 3) break;
        const sorted = [...items].sort((a, b) => a.x - b.x);
        const minLeft = sorted[0].x;
        const maxRight = sorted[sorted.length - 1].x + sorted[sorted.length - 1].w;
        const totalW = sorted.reduce((sum, it) => sum + it.w, 0);
        const gap = (maxRight - minLeft - totalW) / (sorted.length - 1);
        let curX = minLeft;
        for (const it of sorted) {
          it.x = Math.max(m, Math.min(paper.w - m - it.w, curX));
          curX += it.w + gap;
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
      case 'distributeV': {
        if (items.length < 3) break;
        const sorted = [...items].sort((a, b) => a.y - b.y);
        const minTop = sorted[0].y;
        const maxBottom = sorted[sorted.length - 1].y + sorted[sorted.length - 1].h;
        const totalH = sorted.reduce((sum, it) => sum + it.h, 0);
        const gap = (maxBottom - minTop - totalH) / (sorted.length - 1);
        let curY = minTop;
        for (const it of sorted) {
          it.y = Math.max(m, Math.min(paper.h - m - it.h, curY));
          curY += it.h + gap;
          renderImageItem(it, side);
          syncLinkedItem(it, side);
        }
        break;
      }
    }
  }

  if (didSomething) {
    updateSelectedPanel();
    saveHistory();
    const labels = {
      left: '左对齐', right: '右对齐', centerH: '水平居中',
      top: '顶对齐', bottom: '底对齐', centerV: '垂直居中',
      distributeH: '水平等距分布', distributeV: '垂直等距分布',
    };
    showToast(labels[type] || '对齐完成', 'success');
  }
}

function alignToPage(type) {
  if (STATE.selectedItems.length === 0) return;
  const bySide = getSelectedItemsBySide();
  const paper = getPaperDimensions();
  const m = getMargin();

  for (const side of ['front', 'back']) {
    const items = bySide[side];
    if (items.length === 0) continue;

    for (const it of items) {
      switch (type) {
        case 'pageLeft':
          it.x = m;
          break;
        case 'pageCenterH':
          it.x = m + (paper.w - 2 * m - it.w) / 2;
          break;
        case 'pageRight':
          it.x = paper.w - m - it.w;
          break;
        case 'pageTop':
          it.y = m;
          break;
        case 'pageCenterV':
          it.y = m + (paper.h - 2 * m - it.h) / 2;
          break;
        case 'pageBottom':
          it.y = paper.h - m - it.h;
          break;
      }
      renderImageItem(it, side);
      syncLinkedItem(it, side);
    }
  }

  updateSelectedPanel();
  saveHistory();
  const labels = {
    pageLeft: '左对齐到页面', pageCenterH: '水平居中到页面', pageRight: '右对齐到页面',
    pageTop: '顶对齐到页面', pageCenterV: '垂直居中到页面', pageBottom: '底对齐到页面',
  };
  showToast(labels[type] || '已对齐到页面', 'success');
}

// ==================== 打印 ====================
function printPage() {
  const paper = getPaperDimensions();
  const pxPerMm = 96 / 25.4;
  const gap = 0.5;

  // 裁切线样式与PDF导出完全一致：浅灰虚线、延伸至页面边缘、自动避让其他图片
  function cropMarksHtml(item, allItems) {
    const bleed = item.bleed || 0;
    const left = item.x + bleed;
    const right = item.x + item.w - bleed;
    const top = item.y + bleed;
    const bottom = item.y + item.h - bleed;
    const markLeft = left - gap;
    const markRight = right + gap;
    const markTop = top - gap;
    const markBottom = bottom + gap;

    const obstacles = allItems
      .filter(it => it.id !== item.id)
      .map(it => ({
        left: it.x - gap - 0.01,
        top: it.y - gap - 0.01,
        right: it.x + it.w + gap + 0.01,
        bottom: it.y + it.h + gap + 0.01,
      }));

    let html = '';
    const cmStyle = `-webkit-print-color-adjust:exact;print-color-adjust:exact;`;
    const lw = 1;
    const cmColor = '#b4b4b4';

    function drawH(y, xStart, xEnd) {
      if (y < 0 || y > paper.h) return;
      const hObs = obstacles
        .filter(o => y >= o.top - 0.01 && y <= o.bottom + 0.01)
        .map(o => ({ start: Math.max(xStart, o.left), end: Math.min(xEnd, o.right) }));
      const segs = getVisibleSegments(xStart, xEnd, hObs);
      for (const seg of segs) {
        if (seg.end - seg.start < 0.5) continue;
        html += `<div style="${cmStyle}position:absolute;left:${seg.start * pxPerMm}px;top:${y * pxPerMm}px;width:${(seg.end - seg.start) * pxPerMm}px;height:0;border-top:${lw}px dashed ${cmColor};"></div>`;
      }
    }

    function drawV(x, yStart, yEnd) {
      if (x < 0 || x > paper.w) return;
      const vObs = obstacles
        .filter(o => x >= o.left - 0.01 && x <= o.right + 0.01)
        .map(o => ({ start: Math.max(yStart, o.top), end: Math.min(yEnd, o.bottom) }));
      const segs = getVisibleSegments(yStart, yEnd, vObs);
      for (const seg of segs) {
        if (seg.end - seg.start < 0.5) continue;
        html += `<div style="${cmStyle}position:absolute;left:${x * pxPerMm}px;top:${seg.start * pxPerMm}px;width:0;height:${(seg.end - seg.start) * pxPerMm}px;border-left:${lw}px dashed ${cmColor};"></div>`;
      }
    }

    drawH(markTop, 0, markLeft);
    drawV(markLeft, 0, markTop);
    drawH(markTop, markRight, paper.w);
    drawV(markRight, 0, markTop);
    drawH(markBottom, 0, markLeft);
    drawV(markLeft, markBottom, paper.h);
    drawH(markBottom, markRight, paper.w);
    drawV(markRight, markBottom, paper.h);

    return html;
  }

  saveCurrentPageState();

  const hasDoubleSided = STATE.pages.some(page =>
    page.items.front.some(it => it.image) && page.items.back.some(it => it.image)
  );

  let pagesHtml = '';
  for (let pageIdx = 0; pageIdx < STATE.pages.length; pageIdx++) {
    const pageItems = STATE.pages[pageIdx].items;
    const sides = [
      { side: 'front', items: pageItems.front },
      { side: 'back', items: pageItems.back }
    ];

    for (const s of sides) {
      const hasImages = s.items.some(it => it.image);
      if (!hasImages && !hasDoubleSided) continue;
      const showCrop = s.side === 'front' ? STATE.showCropMarksFront : STATE.showCropMarksBack;
      let itemsHtml = '';
      for (const item of s.items) {
        if (!item.image) continue;
        const rotation = item.rotation || 0;
        itemsHtml += `
        <div style="position:absolute;left:${item.x * pxPerMm}px;top:${item.y * pxPerMm}px;width:${item.w * pxPerMm}px;height:${item.h * pxPerMm}px;overflow:hidden;">
          <img src="${item.image}" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(${rotation}deg);width:100%;height:100%;object-fit:cover;"/>
        </div>`;
      }
      if (showCrop && hasImages) {
        for (const item of s.items) {
          itemsHtml += cropMarksHtml(item, s.items);
        }
      }
      pagesHtml += `
      <div class="print-page" style="position:relative;width:${paper.w * pxPerMm}px;height:${paper.h * pxPerMm}px;background:#fff;">
        ${itemsHtml}
      </div>`;
    }
  }

  if (!pagesHtml) {
    showToast('所有页面都没有图片，无法打印', 'error');
    return;
  }

  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:0;height:0;border:0;';
  document.body.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>打印</title>
      <style>
        @page { size: ${paper.w}mm ${paper.h}mm; margin: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #fff; }
        .print-page { page-break-after: always; position: relative; }
        .print-page:last-child { page-break-after: auto; }
      </style>
    </head>
    <body>
      ${pagesHtml}
    </body>
    </html>
  `);
  doc.close();

  setTimeout(function() {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    } catch(e) {
      showToast('打印失败，请重试', 'error');
    }
    setTimeout(function() {
      if (iframe.parentNode) document.body.removeChild(iframe);
    }, 1000);
  }, 800);
}

// ==================== PDF 导出 ====================
async function exportPDF() {
  showToast('正在生成PDF...', '');

  const paper = getPaperDimensions();
  const orientation = STATE.orientation === 'portrait' ? 'p' : 'l';
  const format = STATE.paperSize === 'custom'
    ? [paper.w, paper.h]
    : STATE.paperSize.toLowerCase();

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation, unit: 'mm', format });

  function drawCropMarksForSide(pdf, side, items) {
    const showCrop = side === 'front' ? STATE.showCropMarksFront : STATE.showCropMarksBack;
    if (!showCrop) return;
    pdf.setDrawColor(180, 180, 180);
    pdf.setLineWidth(0.2);
    pdf.setLineDashPattern([2, 2], 0);
    const gap = 0.5;

    for (const item of items) {
      const bleed = item.bleed || 0;
      const left = item.x + bleed;
      const right = item.x + item.w - bleed;
      const top = item.y + bleed;
      const bottom = item.y + item.h - bleed;
      const markLeft = left - gap;
      const markRight = right + gap;
      const markTop = top - gap;
      const markBottom = bottom + gap;

      const obstacles = items
        .filter(it => it.id !== item.id)
        .map(it => ({
          left: it.x - gap - 0.01,
          top: it.y - gap - 0.01,
          right: it.x + it.w + gap + 0.01,
          bottom: it.y + it.h + gap + 0.01,
        }));

      function drawH(y, xStart, xEnd) {
        if (y < 0 || y > paper.h) return;
        const hObs = obstacles
          .filter(o => y >= o.top - 0.01 && y <= o.bottom + 0.01)
          .map(o => ({ start: Math.max(xStart, o.left), end: Math.min(xEnd, o.right) }));
        const segs = getVisibleSegments(xStart, xEnd, hObs);
        for (const seg of segs) {
          if (seg.end - seg.start < 0.5) continue;
          pdf.line(seg.start, y, seg.end, y);
        }
      }

      function drawV(x, yStart, yEnd) {
        if (x < 0 || x > paper.w) return;
        const vObs = obstacles
          .filter(o => x >= o.left - 0.01 && x <= o.right + 0.01)
          .map(o => ({ start: Math.max(yStart, o.top), end: Math.min(yEnd, o.bottom) }));
        const segs = getVisibleSegments(yStart, yEnd, vObs);
        for (const seg of segs) {
          if (seg.end - seg.start < 0.5) continue;
          pdf.line(x, seg.start, x, seg.end);
        }
      }

      drawH(markTop, 0, markLeft);
      drawV(markLeft, 0, markTop);

      drawH(markTop, markRight, paper.w);
      drawV(markRight, 0, markTop);

      drawH(markBottom, 0, markLeft);
      drawV(markLeft, markBottom, paper.h);

      drawH(markBottom, markRight, paper.w);
      drawV(markRight, markBottom, paper.h);
    }
    pdf.setLineDashPattern([], 0);
  }

  async function drawSide(pdf, side, items) {
    for (const item of items) {
      if (!item.image) continue;
      const ix = Number(item.x) || 0;
      const iy = Number(item.y) || 0;
      const iw = Number(item.w) || 0;
      const ih = Number(item.h) || 0;
      if (iw <= 0 || ih <= 0 || !isFinite(iw) || !isFinite(ih)) continue;
      let format = 'PNG';
      if (item.image.startsWith('data:image/jpeg') || item.image.startsWith('data:image/jpg')) format = 'JPEG';
      else if (item.image.startsWith('data:image/webp')) format = 'WEBP';
      const rotation = Number(item.rotation) || 0;
      try {
        if (rotation === 90 || rotation === 270) {
          const px = ix + (iw - ih) / 2;
          const py = iy + (ih - iw) / 2;
          pdf.addImage(item.image, format, px, py, ih, iw, null, null, rotation);
        } else if (rotation === 180) {
          pdf.addImage(item.image, format, ix, iy, iw, ih, null, null, 180);
        } else {
          pdf.addImage(item.image, format, ix, iy, iw, ih);
        }
      } catch (err) {
        console.error('图片添加失败，尝试Canvas转换:', err);
        try {
          const img = await new Promise((resolve, reject) => {
            const i = new Image();
            i.onload = () => resolve(i);
            i.onerror = reject;
            i.src = item.image;
          });
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth || 100;
          canvas.height = img.naturalHeight || 100;
          canvas.getContext('2d').drawImage(img, 0, 0);
          if (rotation === 90 || rotation === 270) {
            const px = ix + (iw - ih) / 2;
            const py = iy + (ih - iw) / 2;
            pdf.addImage(canvas, 'PNG', px, py, ih, iw, null, null, rotation);
          } else if (rotation === 180) {
            pdf.addImage(canvas, 'PNG', ix, iy, iw, ih, null, null, 180);
          } else {
            pdf.addImage(canvas, 'PNG', ix, iy, iw, ih);
          }
        } catch(err2) {
          console.error('Canvas转换也失败:', err2, { ix, iy, iw, ih, rotation, format });
        }
      }
    }
    drawCropMarksForSide(pdf, side, items);
  }

  saveCurrentPageState();

  const hasDoubleSided = STATE.pages.some(page =>
    page.items.front.some(it => it.image) && page.items.back.some(it => it.image)
  );

  let hasAnyContent = false;
  for (const page of STATE.pages) {
    const frontHasImages = page.items.front.some(it => it.image);
    const backHasImages = page.items.back.some(it => it.image);
    if (!frontHasImages && !backHasImages) continue;

    if (frontHasImages || hasDoubleSided) {
      if (hasAnyContent) pdf.addPage();
      if (frontHasImages) {
        await drawSide(pdf, 'front', page.items.front);
      }
      hasAnyContent = true;
    }

    if (backHasImages || hasDoubleSided) {
      if (hasAnyContent) pdf.addPage();
      if (backHasImages) {
        await drawSide(pdf, 'back', page.items.back);
      }
      hasAnyContent = true;
    }
  }

  if (!hasAnyContent) {
    showToast('所有页面都没有图片，无法导出', 'error');
    return;
  }

  const today = new Date();
  const dateStr = today.getFullYear().toString() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  const fileName = STATE.paperSize === 'custom'
    ? `CutAlong_${dateStr}`
    : `CutAlong_${STATE.paperSize.toUpperCase()}_${dateStr}`;
  pdf.save(fileName);
  showToast('PDF已导出！', 'success');
}

// ==================== 复制（浮动按钮，点击即复制并粘贴）====================
function duplicateSelectedItems() {
  if (STATE.selectedItems.length === 0) return;
  const paper = getPaperDimensions();
  const m = getMargin();

  const clips = STATE.selectedItems.map(sel => {
    const item = getImageItem(sel.side, sel.id);
    if (!item) return null;
    return {
      side: sel.side,
      image: item.image,
      w: item.w,
      h: item.h,
      x: item.x,
      y: item.y,
      rotation: item.rotation || 0,
      bleed: item.bleed || 0,
    };
  }).filter(Boolean);

  deselectAll();

  for (const clip of clips) {
    const offsetX = Math.min(clip.x + 5, paper.w - m - clip.w);
    const offsetY = Math.min(clip.y + 5, paper.h - m - clip.h);
    const item = createImageItem(clip.image, clip.side, offsetX, offsetY, clip.w, clip.h, 0, 0);
    item.rotation = clip.rotation || 0;
    item.bleed = clip.bleed || 0;
    renderImageItem(item, clip.side);
    syncLinkedItem(item, clip.side);
    STATE.selectedItems.push({ side: clip.side, id: item.id });
  }

  updateSelectionStyles();
  updateSelectedPanel();
  renderAllCropMarks('front');
  renderAllCropMarks('back');
  renderRulerHighlight();
  saveHistory();
  showToast(`已复制 ${clips.length} 张图片`, 'success');
}

  });

    STATE.showGrid = e.target.checked;
    for (const side of ['front', 'back']) {
      const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
      updateCanvasGrid(canvas);
    }
  });

  $('#showRuler').addEventListener('change', (e) => {
    STATE.showRuler = e.target.checked;
    $('#rulerH').style.display = STATE.showRuler ? '' : 'none';
    $('#rulerV').style.display = STATE.showRuler ? '' : 'none';
    renderRuler();
  });

  $('#workspace').addEventListener('scroll', () => {
    if (!STATE.showRuler) return;
    const ws = $('#workspace');
    $('#rulerHInner').style.transform = `translateX(${-ws.scrollLeft}px)`;
    $('#rulerVInner').style.transform = `translateY(${-ws.scrollTop}px)`;
  });

  $$('.crop-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const side = btn.dataset.crop;
      const key = side === 'front' ? 'showCropMarksFront' : 'showCropMarksBack';
      STATE[key] = !STATE[key];
      btn.classList.toggle('active', STATE[key]);
      for (const item of STATE.items[side]) {
        renderImageItem(item, side);
      }
    });
  });

  const ZOOM_LEVELS = [0.5, 0.75, 1, 1.25, 1.5, 2];

  function getCurrentZoomRatio() {
    return STATE.zoom === 'fit' ? STATE.fitScale / BASE_SCALE : parseFloat(STATE.zoom);
  }

  function getFitRatio() {
    return Math.round((STATE.fitScale / BASE_SCALE) * 100) / 100;
  }

  function getZoomRange() {
    const fitRatio = getFitRatio();
    return {
      min: Math.min(0.5, fitRatio),
      max: Math.max(2, fitRatio),
    };
  }

  function getEffectiveZoomLevels() {
    const fitRatio = getFitRatio();
    const levels = [...ZOOM_LEVELS];
    if (fitRatio < ZOOM_LEVELS[0] - 0.01) levels.unshift(fitRatio);
    if (fitRatio > ZOOM_LEVELS[ZOOM_LEVELS.length - 1] + 0.01) levels.push(fitRatio);
    return levels;
  }

  function updateZoomUI() {
    const display = $('#zoomDisplay');
    const ratio = getCurrentZoomRatio();
    display.textContent = Math.round(ratio * 100) + '%';
    $$('.zoom-btn[data-zoom]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.zoom === STATE.zoom);
    });
    const range = getZoomRange();
    const current = getCurrentZoomRatio();
    $('#zoomIn').disabled = current >= range.max - 0.005;
    $('#zoomOut').disabled = current <= range.min + 0.005;
  }

  $$('.zoom-btn[data-zoom]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.zoom = btn.dataset.zoom;
      updateCanvasSize();
      updateZoomUI();
    });
  });

  $('#zoomIn').addEventListener('click', () => {
    if ($('#zoomIn').disabled) return;
    const current = getCurrentZoomRatio();
    const levels = getEffectiveZoomLevels();
    const newZoom = levels.find(z => z > current + 0.001);
    if (newZoom !== undefined) {
      STATE.zoom = String(newZoom);
      updateCanvasSize();
      updateZoomUI();
    }
  });

  $('#zoomOut').addEventListener('click', () => {
    if ($('#zoomOut').disabled) return;
    const current = getCurrentZoomRatio();
    const levels = getEffectiveZoomLevels();
    const newZoom = [...levels].reverse().find(z => z < current - 0.001);
    if (newZoom !== undefined) {
      STATE.zoom = String(newZoom);
      updateCanvasSize();
      updateZoomUI();
    }
  });

  updateZoomUI();
  window._updateZoomUI = updateZoomUI;

  $('#exportPdf').addEventListener('click', exportPDF);
  $('#printBtn').addEventListener('click', printPage);

  $('#uploadBtnFront').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = (e) => handleFileUpload(e.target.files, 'front');
    input.click();
  });

  $('#uploadBtnBack').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = (e) => handleFileUpload(e.target.files, 'back');
    input.click();
  });

  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      canvas.classList.add('drag-over');
    });
    canvas.addEventListener('dragleave', () => {
      canvas.classList.remove('drag-over');
    });
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      canvas.classList.remove('drag-over');
      handleFileUpload(e.dataTransfer.files, side);
    });
    canvas.addEventListener('mousedown', (e) => {

  ['itemX', 'itemY', 'itemW', 'itemH'].forEach(id => {
    $('#' + id).addEventListener('change', applyPanelValues);
  });

  $('#itemBleed').addEventListener('change', (e) => {
    if (STATE.selectedItems.length === 0) return;

    for (const sel of STATE.selectedItems) {
      const item = getImageItem(sel.side, sel.id);
      if (item) {
        item.bleed = bleed;
        renderImageItem(item, sel.side);
      }
    }
    saveHistory();
  });

  $('#replaceItem').addEventListener('click', replaceImage);

  $('#alignLeft').addEventListener('click', () => alignItems('left'));
  $('#alignRight').addEventListener('click', () => alignItems('right'));
  $('#alignCenterH').addEventListener('click', () => alignItems('centerH'));
  $('#alignTop').addEventListener('click', () => alignItems('top'));
  $('#alignBottom').addEventListener('click', () => alignItems('bottom'));
  $('#alignCenterV').addEventListener('click', () => alignItems('centerV'));
  $('#distributeH').addEventListener('click', () => alignItems('distributeH'));
  $('#distributeV').addEventListener('click', () => alignItems('distributeV'));

  $('#pageAlignLeft').addEventListener('click', () => alignToPage('pageLeft'));
  $('#pageAlignCenterH').addEventListener('click', () => alignToPage('pageCenterH'));
  $('#pageAlignRight').addEventListener('click', () => alignToPage('pageRight'));

  $('#undoBtn').addEventListener('click', undo);

  $('#themeToggle').addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    $('#themeToggle').innerHTML = next === 'dark'
