    updateCanvasSize();
    recomputeAllBackPositions();
    if (STATE.pages.length > 1) showToast('纸张宽度已修改，所有页面已同步更新', '');
  });

  $('#customH').addEventListener('change', (e) => {
    STATE.customH = Math.max(10, parseFloat(e.target.value) || 297);
    updateCanvasSize();
    recomputeAllBackPositions();
    if (STATE.pages.length > 1) showToast('纸张高度已修改，所有页面已同步更新', '');
  });

  $$('.orientation-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.orientation-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.orientation = btn.dataset.orientation;
      updateCanvasSize();
      recomputeAllBackPositions();
      updateFlipIndicator();
      saveHistory();
      if (STATE.pages.length > 1) showToast('页面方向已切换，所有页面已同步更新', '');
    });
  });

  $$('.flip-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.flip-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.flipMode = btn.dataset.flip;
      updateFlipIndicator();
      recomputeAllBackPositions();
      saveHistory();
      if (STATE.pages.length > 1) showToast('翻页方向已切换，所有页面已同步更新', '');
    });
  });

  $('#marginSize').addEventListener('change', (e) => {
    STATE.margin = parseFloat(e.target.value) || 0;
    updateCanvasSize();
  });

  $('#snapThreshold').addEventListener('change', (e) => {
    STATE.snapThreshold = parseFloat(e.target.value) || 0;
  });

  $('#showGrid').addEventListener('change', (e) => {
    STATE.showGrid = e.target.checked;
    for (const side of ['front', 'back']) {
      const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
      updateCanvasGrid(canvas);
    }
  });

  $('#showRuler').addEventListener('change', (e) => {
    STATE.showRuler = e.target.checked;
    $('#rulerH').style.display = STATE.showRuler ? '' : 'none';
    $('#rulerV').style.display = STATE.showRuler ? '' : 'none';
    renderRuler();
  });

  $('#workspace').addEventListener('scroll', () => {
    if (!STATE.showRuler) return;
    const ws = $('#workspace');
    $('#rulerHInner').style.transform = `translateX(${-ws.scrollLeft}px)`;
    $('#rulerVInner').style.transform = `translateY(${-ws.scrollTop}px)`;
  });

  $$('.crop-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const side = btn.dataset.crop;
      const key = side === 'front' ? 'showCropMarksFront' : 'showCropMarksBack';
      STATE[key] = !STATE[key];
      btn.classList.toggle('active', STATE[key]);
      for (const item of STATE.items[side]) {
        renderImageItem(item, side);
      }
    });
  });

  const ZOOM_LEVELS = [0.5, 0.75, 1, 1.25, 1.5, 2];

  function getCurrentZoomRatio() {
    return STATE.zoom === 'fit' ? STATE.fitScale / BASE_SCALE : parseFloat(STATE.zoom);
  }

  function getFitRatio() {
    return Math.round((STATE.fitScale / BASE_SCALE) * 100) / 100;
  }

  function getZoomRange() {
    const fitRatio = getFitRatio();
    return {
      min: Math.min(0.5, fitRatio),
      max: Math.max(2, fitRatio),
    };
  }

  function getEffectiveZoomLevels() {
    const fitRatio = getFitRatio();
    const levels = [...ZOOM_LEVELS];
    if (fitRatio < ZOOM_LEVELS[0] - 0.01) levels.unshift(fitRatio);
    if (fitRatio > ZOOM_LEVELS[ZOOM_LEVELS.length - 1] + 0.01) levels.push(fitRatio);
    return levels;
  }

  function updateZoomUI() {
    const display = $('#zoomDisplay');
    const ratio = getCurrentZoomRatio();
    display.textContent = Math.round(ratio * 100) + '%';
    $$('.zoom-btn[data-zoom]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.zoom === STATE.zoom);
    });
    const range = getZoomRange();
    const current = getCurrentZoomRatio();
    $('#zoomIn').disabled = current >= range.max - 0.005;
    $('#zoomOut').disabled = current <= range.min + 0.005;
  }

  $$('.zoom-btn[data-zoom]').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.zoom = btn.dataset.zoom;
      updateCanvasSize();
      updateZoomUI();
    });
  });

  $('#zoomIn').addEventListener('click', () => {
    if ($('#zoomIn').disabled) return;
    const current = getCurrentZoomRatio();
    const levels = getEffectiveZoomLevels();
    const newZoom = levels.find(z => z > current + 0.001);
    if (newZoom !== undefined) {
      STATE.zoom = String(newZoom);
      updateCanvasSize();
      updateZoomUI();
    }
  });

  $('#zoomOut').addEventListener('click', () => {
    if ($('#zoomOut').disabled) return;
    const current = getCurrentZoomRatio();
    const levels = getEffectiveZoomLevels();
    const newZoom = [...levels].reverse().find(z => z < current - 0.001);
    if (newZoom !== undefined) {
      STATE.zoom = String(newZoom);
      updateCanvasSize();
      updateZoomUI();
    }
  });

  updateZoomUI();
  window._updateZoomUI = updateZoomUI;

  $('#exportPdf').addEventListener('click', exportPDF);
  $('#printBtn').addEventListener('click', printPage);

  $('#uploadBtnFront').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = (e) => handleFileUpload(e.target.files, 'front');
    input.click();
  });

  $('#uploadBtnBack').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = (e) => handleFileUpload(e.target.files, 'back');
    input.click();
  });

  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      canvas.classList.add('drag-over');
    });
    canvas.addEventListener('dragleave', () => {
      canvas.classList.remove('drag-over');
    });
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      canvas.classList.remove('drag-over');
      handleFileUpload(e.dataTransfer.files, side);
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.target === canvas) {
        startMarquee(e, side);
      }
    });
  }

  ['itemX', 'itemY', 'itemW', 'itemH'].forEach(id => {
    $('#' + id).addEventListener('change', applyPanelValues);
  });

  $('#itemBleed').addEventListener('change', (e) => {
    if (STATE.selectedItems.length === 0) return;
    const bleed = Math.max(0, Math.min(20, parseFloat(e.target.value) || 0));
    for (const sel of STATE.selectedItems) {
      const item = getImageItem(sel.side, sel.id);
      if (item) {
        item.bleed = bleed;
        renderImageItem(item, sel.side);
      }
    }
    saveHistory();
  });

  $('#replaceItem').addEventListener('click', replaceImage);

  $('#alignLeft').addEventListener('click', () => alignItems('left'));
  $('#alignRight').addEventListener('click', () => alignItems('right'));
  $('#alignCenterH').addEventListener('click', () => alignItems('centerH'));
  $('#alignTop').addEventListener('click', () => alignItems('top'));
  $('#alignBottom').addEventListener('click', () => alignItems('bottom'));
  $('#alignCenterV').addEventListener('click', () => alignItems('centerV'));
  $('#distributeH').addEventListener('click', () => alignItems('distributeH'));
  $('#distributeV').addEventListener('click', () => alignItems('distributeV'));

  $('#pageAlignLeft').addEventListener('click', () => alignToPage('pageLeft'));
  $('#pageAlignCenterH').addEventListener('click', () => alignToPage('pageCenterH'));
  $('#pageAlignRight').addEventListener('click', () => alignToPage('pageRight'));
  $('#pageAlignTop').addEventListener('click', () => alignToPage('pageTop'));
  $('#pageAlignCenterV').addEventListener('click', () => alignToPage('pageCenterV'));
  $('#pageAlignBottom').addEventListener('click', () => alignToPage('pageBottom'));

  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);

  $('#themeToggle').addEventListener('click', () => {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    $('#themeToggle').innerHTML = next === 'dark'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
    localStorage.setItem('print-layout-theme', next);
  });

  $('#deleteItem').addEventListener('click', () => {
    if (STATE.selectedItems.length === 0) return;
    const count = STATE.selectedItems.length;
    deleteSelectedItems();
    showToast(`已删除 ${count} 张图片`, 'success');
  });

  $('#clearBtnFront').addEventListener('click', () => {
    for (const side of ['front', 'back']) {
      const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
      canvas.querySelectorAll('.image-item, .crop-marks, .guide-line').forEach(el => el.remove());
    }
    STATE.items.front = [];
    STATE.items.back = [];
    STATE.linkMap.clear();
    deselectAll();
    showToast('已清空全部', 'success');
    saveHistory();
  });

  $('#clearBtnBack').addEventListener('click', () => {
    STATE.items.back.forEach(i => {
      if (i.image) {
        i.image = null;
        i.hasBackImage = false;
        renderImageItem(i, 'back');
      }
    });
    showToast('背面图片已清空', 'success');
    saveHistory();
  });

  document.querySelectorAll('.num-spin-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const inputId = btn.dataset.for;
      const dir = btn.dataset.dir;
      const input = document.getElementById(inputId);
      if (!input) return;
      const step = parseFloat(input.step) || 1;
      let val = parseFloat(input.value) || 0;
      if (dir === 'up') val += step;
      else val -= step;
      const min = input.min !== '' ? parseFloat(input.min) : null;
      const max = input.max !== '' ? parseFloat(input.max) : null;
      if (min !== null && val < min) val = min;
      if (max !== null && val > max) val = max;
      input.value = val;
      input.dispatchEvent(new Event('change'));
    });
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        e.preventDefault();
        e.target.select();
        return;
      }
    }

    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (STATE.selectedItems.length === 0) return;

    const step = e.shiftKey ? 1 : 0.5;

    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      const count = STATE.selectedItems.length;
      deleteSelectedItems();
      showToast(`已删除 ${count} 张图片`, 'success');
      return;
    }

    let dx = 0, dy = 0;

    switch (e.key) {
      case 'ArrowLeft':  dx = -step; break;
      case 'ArrowRight': dx =  step; break;
      case 'ArrowUp':    dy = -step; break;
      case 'ArrowDown':  dy =  step; break;
      default: return;
    }

    e.preventDefault();

    const bySide = {};
    for (const sel of STATE.selectedItems) {
      if (!bySide[sel.side]) bySide[sel.side] = [];
      const item = getImageItem(sel.side, sel.id);
      if (item) bySide[sel.side].push(item);
    }

    for (const side of Object.keys(bySide)) {
      for (const item of bySide[side]) {
        item.x = item.x + dx;
        item.y = item.y + dy;
        renderImageItem(item, side);
        syncLinkedItem(item, side);
      }
    }
    updateSelectedPanel();
    saveHistory();
  });

  window.addEventListener('resize', () => { updateCanvasSize(); if (window._updateZoomUI) window._updateZoomUI(); });
}

// ==================== 多页面管理 ====================
function saveCurrentPageState() {
  if (!STATE.pages[STATE.currentPage]) return;
  const page = STATE.pages[STATE.currentPage];
  page.items = {
    front: STATE.items.front.map(it => ({ ...it, element: null })),
    back: STATE.items.back.map(it => ({ ...it, element: null })),
  };
  page.linkMap = new Map(STATE.linkMap);
  page.history = STATE.history.slice();
  page.historyIndex = STATE.historyIndex;
  page.nextId = STATE.nextId;
}

function loadPageState(index) {
  const page = STATE.pages[index];
  STATE.items = {
    front: page.items.front.map(it => ({ ...it, element: null })),
    back: page.items.back.map(it => ({ ...it, element: null })),
  };
  STATE.linkMap = new Map(page.linkMap);
  STATE.history = page.history.slice();
  STATE.historyIndex = page.historyIndex;
  STATE.nextId = page.nextId;
  STATE.selectedItems = [];
}

function renderCurrentPage() {
  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    if (canvas) canvas.querySelectorAll('.image-item, .crop-marks, .guide-line').forEach(el => el.remove());
  }
  for (const side of ['front', 'back']) {
    for (const item of STATE.items[side]) {
      renderImageItem(item, side);
    }
  }
  updateSelectionStyles();
  updateSelectedPanel();
  renderAllCropMarks('front');
  renderAllCropMarks('back');
  updateUndoRedoButtons();
  updateCanvasSize();
  if (window._updateZoomUI) window._updateZoomUI();
}

function switchPage(index) {
  if (index === STATE.currentPage || index < 0 || index >= STATE.pages.length) return;
  saveCurrentPageState();
  loadPageState(index);
  STATE.currentPage = index;
  renderCurrentPage();
  renderPageTabs();
  showToast(`已切换到${STATE.pages[index].name}`, '');
}

function addPage() {
  saveCurrentPageState();
  const newPage = {
    name: `页面 ${STATE.pages.length + 1}`,
    items: { front: [], back: [] },
    linkMap: new Map(),
    history: [],
    historyIndex: -1,
    nextId: STATE.nextId,
  };
  STATE.pages.push(newPage);
  loadPageState(STATE.pages.length - 1);
  STATE.currentPage = STATE.pages.length - 1;
  renderCurrentPage();
  saveHistory();
  renderPageTabs();
  showToast(`已添加${newPage.name}`, 'success');
}

function deletePage(index) {
  if (STATE.pages.length <= 1) {
    showToast('至少保留一个页面', 'error');
    return;
  }
  const deletedName = STATE.pages[index].name;
  STATE.pages.splice(index, 1);
  if (STATE.currentPage >= index) {
    STATE.currentPage = Math.max(0, STATE.currentPage - 1);
  }
  loadPageState(STATE.currentPage);
  renderCurrentPage();
  renderPageTabs();
  showToast(`已删除${deletedName}`, '');
}

function renderPageTabs() {
  const container = $('#pageTabs');
  if (!container) return;
  container.innerHTML = '';
  STATE.pages.forEach((page, i) => {
    const tab = document.createElement('div');
    tab.className = `page-tab${i === STATE.currentPage ? ' active' : ''}`;
    tab.innerHTML = `<span>${page.name}</span>`;
    if (STATE.pages.length > 1) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'page-tab-close';
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deletePage(i);
      });
      tab.appendChild(closeBtn);
    }
    tab.addEventListener('click', () => switchPage(i));
    container.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'page-tab-add';
  addBtn.textContent = '+';
  addBtn.title = '添加新页面';
  addBtn.addEventListener('click', () => addPage());
  container.appendChild(addBtn);
}

// ==================== 初始化 ====================
function init() {
  for (const side of ['front', 'back']) {
    const canvas = $(`#canvas${side === 'front' ? 'Front' : 'Back'}`);
    if (canvas) canvas.querySelectorAll('.image-item, .crop-marks, .guide-line').forEach(el => el.remove());
  }
  STATE.pages = [{
    name: '页面 1',
    items: { front: [], back: [] },
    linkMap: new Map(),
    history: [],
    historyIndex: -1,
    nextId: 1,
  }];
  STATE.currentPage = 0;
  STATE.items = STATE.pages[0].items;
  STATE.linkMap = STATE.pages[0].linkMap;
  STATE.history = [];
  STATE.historyIndex = -1;
  STATE.selectedItems = [];

  const savedTheme = localStorage.getItem('print-layout-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  $('#themeToggle').innerHTML = savedTheme === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
  initEvents();
  renderPageTabs();
  updateCanvasSize();
  if (window._updateZoomUI) window._updateZoomUI();
  updateSelectedPanel();
  saveHistory();
  showToast('欢迎使用打印排版工具！上传图片开始使用', 'success');
}

window.addEventListener('DOMContentLoaded', init);
</script>
